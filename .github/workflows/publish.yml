name: Publish Docker image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - flavor: cuda
            base_image: nvidia/cuda:12.8.0-runtime-ubuntu22.04
            torch_index: https://download.pytorch.org/whl/cu128
            install_xformers: "true"
            suffix: ""
          - flavor: rocm
            base_image: ubuntu:22.04
            torch_index: https://download.pytorch.org/whl/rocm7.1
            install_xformers: "false"
            suffix: "-rocm"
    steps:
      # The image is large (~13 GB); reclaim space the runner wastes on
      # toolchains we don't need.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: |
            suffix=${{ matrix.suffix }},onlatest=true
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            BASE_IMAGE=${{ matrix.base_image }}
            TORCH_INDEX_URL=${{ matrix.torch_index }}
            INSTALL_XFORMERS=${{ matrix.install_xformers }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
